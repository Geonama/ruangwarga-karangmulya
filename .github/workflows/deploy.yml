name: Deploy RuangWarga to AWS ECS

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ruangwarga-api
  ECS_CLUSTER: ruangwarga-cluster
  ECS_SERVICE: ruangwarga-service
  ECS_TASK_DEFINITION: aws/task-definition.json
  CONTAINER_NAME: ruangwarga-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            PORT=3000
            AWS_REGION=${{ env.AWS_REGION }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_SSL=true
            S3_UPLOAD_BUCKET=${{ secrets.S3_UPLOAD_BUCKET }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          secrets: |
            DB_PASSWORD=${{ secrets.DB_PASSWORD_ARN }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Prepare frontend config
        run: |
          echo 'window.RUANGWARGA_API_BASE = "${{ secrets.API_BASE_URL }}";' > config.js

      - name: Upload static website to S3
        run: |
          aws s3 sync . s3://${{ secrets.STATIC_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "index.html" \
            --include "styles.css" \
            --include "app.js" \
            --include "config.js" \
            --include "assets/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
