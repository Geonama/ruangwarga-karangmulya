name: Deploy RuangWarga to AWS ECS

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ruangwarga-api
  ECS_CLUSTER: ruangwarga-cluster
  ECS_SERVICE: ruangwarga-service
  ECS_TASK_DEFINITION: aws/task-definition.json
  CONTAINER_NAME: ruangwarga-api
  STATIC_BUCKET: ruangwarga-static-geo-152022121-976118139367-ap-southeast-1-an
  CLOUDFRONT_DISTRIBUTION_ID: E1EK9SO28JDAAS
  API_BASE_URL: .

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976118139367:role/githubActionsRuangWargaRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Prepare frontend config
        run: |
          echo 'window.RUANGWARGA_API_BASE = "${{ env.API_BASE_URL }}";' > config.js

      - name: Upload static website to S3
        run: |
          aws s3 sync . s3://${{ env.STATIC_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "index.html" \
            --include "styles.css" \
            --include "app.js" \
            --include "config.js" \
            --include "assets/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
